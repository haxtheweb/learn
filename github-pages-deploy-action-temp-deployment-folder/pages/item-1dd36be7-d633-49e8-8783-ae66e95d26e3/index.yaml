    <h2 slot="heading">Front-end developer</h2>
    <div slot="content">
      <p>Luna has written JavaScript for over a decade. She's seen trends come and go in the many JS ecosystems and is burned out from constantly having to relearn "Thing + Ecosystem". HAX is appealing because it sits on web standards, is easy to piece through sites to trace relationships between HTML tags, and uses CSS variables. She also likes that she can make her own elements and themes using the CLI tools as well as publish using HAX11ty for higher SEO.</p>
    </div>
  </accent-card>

  <h2>Where to start</h2>

  <p>These areas of Learn HAX map most directly to what Luna wants to do:</p>

  <ul>
    <li><a href="tutorial-library/developer-onboarding">Developer Onboarding</a> — fork and clone the repos, install, and verify each project runs.</li>
    <li><a href="block-reference">Block Reference</a> — the full inventory of HAX-capable elements and how they're used in the editor.</li>
    <li><a href="release-notes">Release Notes</a> — track what changes across HAXcms releases.</li>
  </ul>

  <p>Looking to build new elements or themes? The <a
  href="block-reference">Block Reference</a> documents each component's usage;
  combine it with the HAX CLI to scaffold and publish your own.</p>
