content: "<p>Learn HAX is where to learn HAX: tutorials, a reference for every block in the editor, and onboarding for people new to it.</p><p>It is made by the HAX project (HAXTheWeb), an open-source effort to let anyone author, remix and publish on the web without needing to learn how the web works. This site is itself a HAX site; <a href=\"https://github.com/haxtheweb/learn\">its source is on GitHub</a>. Its content is shared under the Creative Commons Attribution-ShareAlike (CC BY-SA) license.</p><p>To see how every part of HAX connects, visit <a href=\"https://hax.cloud/\">hax.cloud</a>. To get in touch, use the <a href=\"contact\">Contact</a> page.</p>"
