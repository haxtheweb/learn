content: >
  <p><strong>Goal:</strong> Stand up a simple, maintainable website for a club,
  team, or community group — with a homepage, an outline of activities/pages, a
  way to show photos and meeting info, and no ongoing hosting lock-in.</p>

  <stop-note title="This is a concept stub" accent-color="grey"
  icon="stopnoteicons:warning-icon" status="warning" message="A dedicated
  concept walkthrough video for club websites is coming soon.">
    <p slot="message">A dedicated concept walkthrough video for club websites is coming soon. The tutorials and blocks below are enough to build a complete club site today.</p>
  </stop-note>

  <h2>Blocks &amp; tutorials you'll use</h2>

  <ul>
    <li><a href="tutorial-library/dashboard-site-basics/haxcms-dashboard">HAXcms Dashboard</a> — create the site from the dashboard.</li>
    <li><a href="tutorial-library/creating-structuring-content">Creating &amp; Structuring Content</a> — add pages for About, Meetings, Photos, Contact.</li>
    <li><a href="tutorial-library/working-with-media">Working with Media</a> — add a photo gallery and meeting videos.</li>
    <li><a href="block-reference/multimedia/image-gallery">Image Gallery</a> and <a href="block-reference/layout/collection-list">Collection List</a> — present members and events.</li>
  </ul>

  <p>Because HAX sites are portable files, the club owns its website and can
  move hosts at any time.</p>
