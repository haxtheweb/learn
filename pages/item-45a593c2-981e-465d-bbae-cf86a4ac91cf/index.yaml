content: "<p>Stuck on a tutorial, found a mistake, or want a topic covered? Here is how to reach the people who make HAX.</p><ul><li><strong>Chat:</strong> the <a href=\"https://discord.gg/aCGxmRHEJP\">HAX Discord</a> is the quickest way to reach us.</li><li><strong>Bugs and ideas:</strong> open an issue in <a href=\"https://github.com/haxtheweb/issues\">haxtheweb/issues</a>, the one queue for every part of HAX.</li><li><strong>Email:</strong> <a href=\"mailto:hax@psu.edu\">hax@psu.edu</a></li><li><strong>Security:</strong> report a vulnerability privately through <a href=\"https://github.com/haxtheweb/issues/security/advisories\">GitHub security advisories</a>.</li></ul><p><a href=\"privacy\">How we handle what you send us</a></p>"
