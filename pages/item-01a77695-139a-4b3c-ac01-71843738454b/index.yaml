content: >

  <p>Presenting material side by side can help the user scan and experience
  parts of material like they would expect to find in a well laid out book page.
  Adding columns to material can provide a small visual treatment to your
  content.</p>

  <h3 data-original-level="H3"
  id="header-e802bad9-46b0-24ab-a801-d9d78a8e7af1">Example</h3>

  <grid-plate layout="1-1" responsive-size="xs" disable-responsive=""
  breakpoint-sm="900" breakpoint-md="1200" breakpoint-lg="1500"
  breakpoint-xl="1800"><media-image
  source="https://images-assets.nasa.gov/image/201106100020HQ/201106100020HQ~thumb.jpg"
  alt="Aquarius SAC-D Launch" citation="NASA/Bill Ingalls" size="wide"
  offset="none" slot="col-1" card="" box=""></media-image>

  <p slot="col-2"><span>A Delta II rocket launches with the Aquarius/SAC-D
  spacecraft payload from Space Launch Complex 2 at Vandenberg Air Force Base,
  Calif. on Friday, June 10, 2011. The joint U.S./Argentinian Aquarius/Satélite
  de Aplicaciones Científicas (SAC)-D mission will map the salinity at the ocean
  surface, information critical to improving our understanding of two major
  components of Earth's climate system: the water cycle and ocean
  circulation.</span></p>

