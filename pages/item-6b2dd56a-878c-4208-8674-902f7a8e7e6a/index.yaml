  track="files/system-settings-dashboard/transcript.vtt"></video-player>

  <h2>How to Configure System Settings in
  HAXcms</h2><h2>Prerequisites</h2><p>Before you begin, make sure you have
  <strong>administrator access</strong> to your HAXcms dashboard. Familiarity
  with basic navigation in HAXcms is helpful but not required.</p><ul><li>Access
  to HAXcms site dashboard</li><li>Administrator
  privileges</li></ul><media-image
  source="files/system-settings-dashboard/images/screenshot-1.jpg"
  caption="Prerequisites" offset="narrow" card="" box=""
  alt="Prerequisites"></media-image><h2>Access the System Settings</h2><p>From
  the site dashboard, click on your <strong>user profile icon</strong> in the
  top right corner. This opens a menu where you can toggle options like <em>dark
  mode</em> and <em>sound effects</em>. To configure deeper settings, select
  <strong>Settings</strong> from this menu.</p><ul><li>User profile icon
  location</li><li>Quick toggles: dark mode, sound effects</li><li>Navigation to
  settings panel</li></ul><media-image
  source="files/system-settings-dashboard/images/screenshot-2.jpg"
  caption="Access the System Settings" offset="narrow" card="" box=""
  alt="Access the System Settings"></media-image><h2>Review Status
  Information</h2><p>Within the <strong>Status</strong> section, you can check
  the current version of HAXcms your site is running. Compare it with the latest
  available version. The status page also displays your server details and
  alerts you to any file system misconfigurations that require
  attention.</p><ul><li>Current vs. latest HAXcms version</li><li>Server
  environment details</li><li>File system health and
  errors</li></ul><media-image
  source="files/system-settings-dashboard/images/screenshot-3.jpg"
  caption="Review Status Information" offset="narrow" card="" box="" alt="Review
  Status Information"></media-image><h2>Manage Skeletons</h2><p>The
  <strong>Skeletons</strong> section lets you control which site creation
  templates (skeletons) are available. Check or uncheck skeletons to enable or
  disable them, then save your changes. This determines which templates users
  can select when creating new sites. You can also turn an existing site into a
  skeleton for future reuse.</p><ul><li>Enable/disable skeletons for site
  creation</li><li>Save skeleton configuration</li><li>Convert a site into a
  reusable skeleton</li></ul><media-image
  source="files/system-settings-dashboard/images/screenshot-4.jpg"
  caption="Manage Skeletons" offset="narrow" card="" box="" alt="Manage
  Skeletons"></media-image><h2>Configure Themes</h2><p>In the
  <strong>Themes</strong> section, you can enable or disable specific themes for
  your site. Disabling a theme removes it from user selection, helping to
  control the look and feel options available to site
  creators.</p><ul><li>Enable/disable available themes</li><li>Streamline theme
  choices for users</li></ul><media-image
  source="files/system-settings-dashboard/images/screenshot-5.jpg"
  caption="Configure Themes" offset="narrow" card="" box="" alt="Configure
  Themes"></media-image><h2>Set Media Policies</h2><p>The <strong>Media</strong>
  section allows you to define policies for image uploads. Set restrictions on
  image size, quality, and acceptable file formats to ensure media consistency
  and performance across your HAXcms sites.</p><ul><li>Define maximum image size
  and quality</li><li>Specify allowed file formats</li></ul><media-image
  source="files/system-settings-dashboard/images/screenshot-6.jpg" caption="Set
  Media Policies" offset="narrow" card="" box="" alt="Set Media
  Policies"></media-image><h2>Explore Third-party Integrations</h2><p>The
  <strong>Third-party Integrations</strong> section is where you’ll eventually
  configure integrations with services like AI tools and YouTube. This area is
  still under development, so expect more options in future
  releases.</p><ul><li>Upcoming integrations: AI, YouTube</li><li>Future
  expansion planned</li></ul><media-image
  source="files/system-settings-dashboard/images/screenshot-7.jpg"
  caption="Explore Third-party Integrations" offset="narrow" card="" box=""
  alt="Explore Third-party
  Integrations"></media-image><h2>Verification</h2><p>After updating system
  settings, refresh your dashboard to confirm your changes are active. Check
  that skeletons, themes, and media policies reflect your adjustments. If you
  encounter any errors, revisit the status section for troubleshooting
  tips.</p><ul><li>Refresh dashboard to verify updates</li><li>Review enabled
  skeletons and themes</li><li>Consult status page for error
  messages</li></ul><media-image
  source="files/system-settings-dashboard/images/screenshot-8.jpg"
  caption="Verification" offset="narrow" card="" box=""
  alt="Verification"></media-image>

